name: Deploy Web (PWA) to GitHub Pages

# Baut die Flutter-Web-Version und veroeffentlicht sie als GitHub Page.
# Zweck: Testern eine installierbare PWA geben, ohne Apple-Developer-Account
# und ohne TestFlight — Link oeffnen, "Zum Home-Bildschirm hinzufuegen".
#
# Laeuft NUR auf dem Integrationsbranch, nicht auf main: main ist der
# Upstream-Stand und startet auf Web nicht (home_widget wirft in main()).
# Der Fix dafuer steckt in diesem Branch.

on:
  push:
    branches: [ integration/ios-complete ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments vermeiden; laufende abbrechen, wenn neue kommen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      - name: Tests
        run: flutter test

      # base-href muss auf das Repo-Unterverzeichnis zeigen, sonst findet
      # die Seite ihre Assets nicht (Pages liefert unter /<repo>/ aus).
      - name: Web bauen
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # GitHub Releases sind flach. Das ADP-Manifest verweist aber auf
      # variant/*.ipa und delta/*.ipa. Ohne diese Ordner bricht das Update ab,
      # obwohl AltStore die neue Version schon anzeigt.
      - name: AltStore-ADP mit Ordnerstruktur ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, shutil, subprocess
          from pathlib import Path

          src = json.load(open("web/altstore/source.json"))
          repo = os.environ["GITHUB_REPOSITORY"]
          for version in src["apps"][0]["versions"]:
              download = version.get("downloadURL") or ""
              if "/altstore/adp/" not in download:
                  continue
              tag = f"ios-{version['version']}-{version['buildVersion']}"
              work = Path("/tmp") / f"adp-{tag}"
              dest = Path("build/web/altstore/adp") / f"{version['version']}-{version['buildVersion']}"
              if work.exists():
                  shutil.rmtree(work)
              work.mkdir(parents=True)
              subprocess.check_call([
                  "gh", "release", "download", tag,
                  "--repo", repo,
                  "--dir", str(work),
              ])
              manifest = json.load(open(work / "manifest.json"))
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copy(work / "manifest.json", dest / "manifest.json")
              shutil.copy(work / "signature", dest / "signature")
              paths = [item["assetPath"] for item in manifest.get("variants") or []]
              paths += [item["assetPath"] for item in manifest.get("deltas") or []]
              for rel in paths:
                  target = dest / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy(work / Path(rel).name, target)
              print(f"{tag}: {len(paths)} Pakete nach {dest}")
          PY

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
