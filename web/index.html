<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Badge-System für Einundzwanzig-Bitcoin-Meetups — mit QR, Nostr Web of Trust und Meetup-Kalender.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Einundzwanzig">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Einundzwanzig Meetup App</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    passkeys_web erwartet ein globales `PasskeyAuthenticator` und ruft dessen
    init() SCHON BEIM REGISTRIEREN DER PLUGINS auf — also vor main(). Das Objekt
    kommt aus einem bundle.js, das man selbst einbinden muesste. Fehlt es, ruft
    das Plugin window.close(): die PWA schliesst sich beim Start selbst, ohne
    Fehlermeldung. Genau das ist passiert, als `passkeys` dazukam.

    Dieser Stub haelt die App am Leben, ohne fremdes minifiziertes JS in denselben
    Origin zu holen, in dem die verschluesselten Schluessel liegen. Passkeys sind
    im Web damit aus — was ohnehin der Stand war: PasskeyPrfService laesst sie nur
    auf einundzwanzig.space und localhost zu, nicht auf github.io.

    hasPasskeySupport() = false sorgt dafuer, dass die Oberflaeche den Passkey gar
    nicht anbietet. register()/login() lehnen mit PRF_UNSUPPORTED ab — den Text
    kennt tPasskeyError() und macht daraus "Passkey ist auf diesem Geraet nicht
    verfuegbar".

    Wer Web-Passkeys wirklich will, ersetzt diesen Stub durch das echte Bundle
    (github.com/corbado/flutter-passkeys). Dann aber bewusst: das ist Fremdcode
    mit Zugriff auf denselben Origin wie der Schluesselspeicher.
  -->
  <script>
    window.PasskeyAuthenticator = {
      init: function () {},
      hasPasskeySupport: function () { return false; },
      isUserVerifyingPlatformAuthenticatorAvailable: function () {
        return Promise.resolve(false);
      },
      isConditionalMediationAvailable: function () {
        return Promise.resolve(false);
      },
      cancelCurrentAuthenticatorOperation: function () {},
      register: function () {
        return Promise.reject(new Error('PRF_UNSUPPORTED'));
      },
      login: function () {
        return Promise.reject(new Error('PRF_UNSUPPORTED'));
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
